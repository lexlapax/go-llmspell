name: testspell
description: A new spell
author: spuri
license: MIT
version: 1.0.0
engine: lua
entry_point: main.lua
timeout: 60s

# Security configuration
# Note: These can be overridden by --security-level and --feature-set CLI flags
security_profile: untrusted  # Maps to security level
# feature_set is controlled by CLI flag, not spell.yaml

# Dependencies (optional)
dependencies: []

# Parameters that can be passed to the spell
parameters:
  - name: prompt
    type: string
    description: The prompt to send to the LLM
    required: true
  - name: model
    type: string
    description: The model to use
    default: gpt-3.5-turbo

# Tags for categorization (optional)
tags:
  - llm
  - basic

# Additional metadata (optional)
metadata:
  category: example
  difficulty: beginner
